services:
  postgres:
    image: postgres:18-alpine
    container_name: oikotie
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata  # Recommended: use subdirectory
    ports:
      - "5000:5432"
    volumes:
      - ./data/postgres-data:/var/lib/postgresql/data:Z
      - ./app/services/init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # Read-only
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

